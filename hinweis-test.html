<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smartstream: Testhinweis</title>
<style>
:root{color-scheme:light dark;--bg:#f6f3fa;--ink:#1e1626;--muted:#5d5369;--btn:#9147ff;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1a1322;--ink:#f3eef8;--muted:#b6abc3}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:400 1.05rem/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box}
main{max-width:26rem;text-align:center}
h1{font-size:1.5rem;margin:0 0 .5rem}
button{font:inherit;font-weight:600;min-height:48px;padding:0 24px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);cursor:pointer}
p{color:var(--muted)}
#out{min-height:3em;color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>Testhinweis</h1>
  <p>Tippe auf den Knopf und erlaube die Hinweise, wenn dein Handy danach fragt.</p>
  <button id="go">Testhinweis senden</button>
  <p id="out" aria-live="polite"></p>
</main>
<script>
const out = document.getElementById('out');
const ok = 'Notification' in window && 'serviceWorker' in navigator;
if (!ok) {
  out.textContent = 'Das geht hier nicht. Öffne diese Seite direkt in Chrome, nicht in der App „Mein Programm“.';
  document.getElementById('go').disabled = true;
}
document.getElementById('go').onclick = async () => {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      out.textContent = 'Hinweise sind blockiert. Erlaube sie für diese Seite in den Chrome-Einstellungen und versuche es nochmal.';
      return;
    }
    await navigator.serviceWorker.register('sw.js');
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('Smartstream', { body: 'Testhinweis: Benachrichtigungen funktionieren.', icon: 'icon-192.png', tag: 'test' });
    out.textContent = 'Gesendet. Der Hinweis sollte jetzt oben auf deinem Handy erscheinen.';
  } catch (e) {
    out.textContent = 'Das hat nicht geklappt: ' + e.message;
  }
};
</script>
</body>
</html>
