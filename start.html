<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Programm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#0f1a2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #e8eef2;
  --surface: #f6f9fb;
  --ink: #13233a;
  --muted: #4e5f73;
  --line: #c6d1da;
  --red: #b3122a;
  --red-deep: #8c0c20;
  --focus: #0b63c5;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1a2a;
    --surface: #172437;
    --ink: #eaf0f5;
    --muted: #a3b2c2;
    --line: #2a3a4f;
    --focus: #7dbbff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1a2a;
  --surface: #172437;
  --ink: #eaf0f5;
  --muted: #a3b2c2;
  --line: #2a3a4f;
  --focus: #7dbbff;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
  max-width: 44rem;
  margin: 0 auto;
  padding: .9rem .8rem calc(5.5rem + env(safe-area-inset-bottom, 0px));
}
h1, .now-title {
  font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1 { margin: 0; font-size: 1.3rem; line-height: 1.1; font-weight: 800; letter-spacing: -.015em; }
.today { margin: .05rem 0 .7rem; font-size: .8rem; color: var(--muted); }
a, button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Dienste mit je drei Vorschlägen */
.service { padding: .7rem 0 .8rem; border-top: 1px solid var(--line); }
.service:first-of-type { border-top: 0; padding-top: 0; }
.service-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .45rem; }
.chip {
  display: inline-flex; align-items: center; min-height: 2.25rem; padding: .25rem .7rem;
  border-radius: .55rem; text-decoration: none;
  font: 800 .98rem/1.1 "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; letter-spacing: -.01em;
}
.browser { display: inline-flex; align-items: center; min-height: 2.25rem; font-size: .8rem; color: var(--muted); text-underline-offset: 2px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .45rem; }
.card { min-width: 0; color: inherit; text-decoration: none; display: block; }
.thumb {
  position: relative; aspect-ratio: 16 / 10; border-radius: .5rem; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--a), var(--b));
}
.thumb svg { width: 46%; height: 62%; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.badge {
  position: absolute; left: .22rem; bottom: .22rem; padding: .05rem .28rem; border-radius: .25rem;
  background: rgba(0, 0, 0, .72); color: #fff; font-size: .62rem; line-height: 1.3; font-weight: 600;
}
.card-title {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  margin-top: .25rem; font-size: .76rem; line-height: 1.2; font-weight: 600;
}
.card-sub { display: block; margin-top: .05rem; font-size: .68rem; line-height: 1.2; color: var(--muted); }
.notice { margin: .45rem 0 0; font-size: .8rem; color: var(--muted); }
.notice a { color: var(--ink); font-weight: 600; }
.netflix { background: #000; color: #ff2a33; }
.prime { background: #00a8e1; color: #03212e; }
.nebula { background: #16245c; color: #8fd2ff; }
.youtube { background: #e00000; color: #fff; }
.twitch { background: #7c3aed; color: #fff; }

/* SRF-Sport-Einblendung */
.lower {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 10;
  background: var(--red);
  color: #fff;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -10px 30px rgba(10, 20, 35, .28);
}
.lower-inner { max-width: 44rem; margin: 0 auto; }
.bar {
  appearance: none;
  width: 100%;
  min-height: 3.5rem;
  padding: .4rem .8rem;
  display: grid;
  grid-template-columns: 1fr auto;
  column-gap: .75rem;
  align-items: center;
  background: transparent;
  border: 0;
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.bar:focus-visible { outline-color: #fff; outline-offset: -5px; }
.now-label { display: block; font-size: .7rem; font-weight: 600; opacity: .92; }
.now-title { display: block; font-size: .95rem; line-height: 1.15; font-weight: 800; letter-spacing: -.012em; }
.now-when { display: block; font-size: .76rem; }
.chev { font-size: .76rem; font-weight: 600; white-space: nowrap; }
.sheet {
  max-height: min(78vh, 42rem);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--red-deep);
  padding: .25rem 1rem .75rem;
}
.sheet[hidden] { display: none; }
.sheet ul { list-style: none; margin: 0; padding: 0; }
.cal-head { display: grid; grid-template-columns: 2.75rem 1fr 2.75rem; align-items: center; margin: .25rem 0 .35rem; }
.cal-month { text-align: center; font-weight: 800; font-size: 1.02rem; }
.cal-nav { appearance: none; height: 2.75rem; background: transparent; border: 0; border-radius: .6rem; color: #fff; font: inherit; font-size: 1.35rem; font-weight: 700; cursor: pointer; }
.cal-nav:disabled { opacity: .3; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .15rem; }
.cal-dow { text-align: center; font-size: .72rem; font-weight: 600; padding-bottom: .15rem; }
.cal-day { appearance: none; position: relative; min-height: 2.75rem; padding: .3rem 0 .85rem; background: transparent; border: 0; border-radius: .6rem; color: inherit; font: inherit; font-size: .92rem; text-align: center; }
.cal-day:not(button) { opacity: .62; }
.cal-day.outside { visibility: hidden; }
button.cal-day { background: rgba(255, 255, 255, .13); font-weight: 700; cursor: pointer; }
.cal-day.today { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .85); }
button.cal-day[aria-pressed="true"] { background: #fff; color: var(--red-deep); }
.cal-dots { position: absolute; left: 0; right: 0; bottom: .32rem; display: flex; justify-content: center; gap: .2rem; }
.cal-dot { flex: none; display: block; width: .4rem; height: .4rem; border-radius: 50%; background: #fff; }
.cal-dot.sport1 { background: #ffd23f; }
button.cal-day[aria-pressed="true"] .cal-dot { background: var(--red-deep); }
button.cal-day[aria-pressed="true"] .cal-dot.sport1 { background: #a86f00; }
.cal-legend { display: flex; gap: 1rem; margin: .5rem 0 0; font-size: .76rem; }
.cal-legend span { display: inline-flex; align-items: center; gap: .3rem; }
.cal-title { margin: .8rem 0 0; font-size: .98rem; font-weight: 800; }
.cal-day:focus-visible, .cal-nav:focus-visible { outline-color: #fff; }
.event { padding: .7rem 0; border-bottom: 1px solid rgba(255, 255, 255, .22); }
.event:last-child { border-bottom: 0; }
.event-top { display: flex; justify-content: space-between; gap: .75rem; font-size: .84rem; }
.event-name { display: block; margin-top: .1rem; font-weight: 600; line-height: 1.25; }
.event-note { display: block; margin-top: .1rem; font-size: .82rem; }
.event a { color: #fff; font-weight: 600; text-underline-offset: 2px; }
.event a:focus-visible, .sheet a:focus-visible { outline-color: #fff; }
.sheet-foot { margin: .6rem 0 .25rem; font-size: .84rem; }
.sheet-foot a { color: #fff; font-weight: 600; }

@media (min-width: 40rem) {
  .card-title { font-size: .86rem; }
}

.sport-toggle { display: none; }

/* Desktop im Querformat: Programm links, Sportkalender fest rechts */
@media (min-width: 62rem) and (orientation: landscape) {
  main { position: relative; }
  .sport-toggle {
    display: inline-flex; align-items: center; position: absolute; top: 1.4rem; right: 1.75rem;
    min-height: 2.5rem; padding: .3rem .85rem; border: 1px solid var(--line); border-radius: .6rem;
    background: var(--surface); color: var(--ink); font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer;
  }
  main { max-width: none; margin: 0 24rem 0 0; padding: 1.4rem 1.75rem 1.75rem; }
  h1 { font-size: 1.7rem; }
  .today { font-size: .92rem; margin-bottom: 1rem; }
  #services { display: grid; grid-template-columns: repeat(auto-fit, minmax(24rem, 1fr)); gap: 1rem; align-items: start; }
  .service, .service:first-of-type { border: 1px solid var(--line); border-radius: .85rem; background: var(--surface); padding: .85rem; }
  .cards { gap: .6rem; }
  .card-sub { font-size: .76rem; }
  .lower { top: 0; bottom: 0; left: auto; right: 0; width: 24rem; box-shadow: -10px 0 30px rgba(10, 20, 35, .22); }
  .lower-inner { display: flex; flex-direction: column-reverse; justify-content: flex-end; height: 100%; max-width: none; }
  .bar { flex: none; padding: .9rem 1rem; pointer-events: none; }
  .chev { display: none; }
  .sheet, .sheet[hidden] { display: block; flex: 1 1 0; min-height: 0; max-height: none; }
  .sport-hidden main { margin-right: 0; }
  .sport-hidden .lower { display: none; }
}
</style>
</head>
<body>
<main>
  <h1>Mein Programm</h1>
  <button class="sport-toggle" id="sportToggle" type="button"></button>
  <p class="today" id="today"></p>
  <div id="services"></div>
  <p class="notice" id="stand"></p>
</main>

<aside class="lower" aria-label="SRF Sport und Sport 1">
  <div class="lower-inner">
    <div class="sheet" id="sheet" hidden></div>
    <button class="bar" id="bar" type="button" aria-expanded="false" aria-controls="sheet">
      <span>
        <span class="now-label" id="nowLabel">SRF Sport, nächster Livestream</span>
        <span class="now-title" id="nowTitle"></span>
        <span class="now-when" id="nowWhen"></span>
      </span>
      <span class="chev" id="chev">Kalender</span>
    </button>
  </div>
</aside>

/* Filtert das SRF-Programm nach deinen Sportarten. */
const SRF_API = "https://il.srgssr.ch/integrationlayer/2.0/srf/mediaList/video/scheduledLivestreams?vector=portalplay&pageSize=100";
function srfInteresting(title) {
  const t = title.trim();
  if (/Gebärdensprache|Medienkonferenz/.test(t)) return false;
  if (/^Ski Alpin\s*:/.test(t)) return !/Siegerehrung|Star Challenge/.test(t);
  if (/^(Rad|Radsport|Bahnrad|Strassenrad|Mountainbike|Bike|Radquer|Querfeldein|Cyclocross|Triathlon|OL|Orientierungslauf)\b/.test(t)) return true;
  const swiss = /\bSchweiz\b/.test(t);
  if (/^Eishockey\s*:/.test(t) && (swiss || /National League/.test(t))) return true;
  const champs = /(^|[\s:,-])(EM|WM)([\s,:]|$)/.test(t) && !/Qualifikation/.test(t);
  return champs && (swiss || !/\S - \S/.test(t));
}
function srfSlug(t) {
  return t.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function srfEvents(list) {
  const items = list.filter(x => x.title && x.validFrom && srfInteresting(x.title));
  const key = t => t.trim().replace(/,\s*[12]\. Lauf$/, "");
  const second = new Map(items.filter(x => /2\. Lauf$/.test(x.title.trim())).map(x => [key(x.title), x]));
  const firsts = new Set(items.filter(x => /1\. Lauf$/.test(x.title.trim())).map(x => key(x.title)));
  const events = [];
  items.forEach(x => {
    const raw = x.title.trim();
    if (/2\. Lauf$/.test(raw) && firsts.has(key(raw))) return;
    const colon = raw.indexOf(":");
    const sport = raw.slice(0, colon).trim();
    const parts = key(raw).slice(colon + 1).split(",").map(s => s.trim()).filter(Boolean);
    const e = { t: x.validFrom, h: 3, sport: sport === "Ski Alpin" ? "Ski alpin" : sport };
    const place = parts[0] && parts[0].match(/^Weltcup (?:in|im) (.+)$/);
    const run2 = second.get(key(raw));
    if (place) {
      e.name = parts.slice(1).join(", ");
      e.note = place[1];
      if (run2) {
        e.note += ", 2. Lauf " + new Date(run2.validFrom).toLocaleTimeString("de-CH", { timeZone: "Europe/Zurich", hour: "2-digit", minute: "2-digit" });
        e.h = (new Date(run2.validFrom) - new Date(x.validFrom)) / 3600000 + 2;
      }
    } else if (/\S - \S/.test(parts[parts.length - 1] || "")) {
      e.name = parts[parts.length - 1].replace(" - ", " – ");
      e.note = parts.slice(0, -1).join(", ");
    } else {
      e.name = parts.join(", ");
      e.note = /final|bronze/i.test(e.name) ? "Schweizer Beteiligung noch offen" : "";
    }
    if (x.cesimId) e.url = play(srfSlug(raw), x.cesimId);
    events.push(e);
  });
  return events;
}

const TZ = "Europe/Zurich";
const fmtDay = new Intl.DateTimeFormat("de-CH", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });

const fmtKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });

function dayNumber(date) {
  const [y, m, d] = fmtKey.format(date).split("-").map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}
function relative(date, now) {
  const days = dayNumber(date) - dayNumber(now);
  if (days === 0) return "heute";
  if (days === 1) return "morgen";
  return "in " + days + " Tagen";
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* Monatskalender: Tage mit Terminen lassen sich antippen. */
let calDay = null, calMonth = null;
const fmtMonth = new Intl.DateTimeFormat("de-CH", { timeZone: "UTC", month: "long", year: "numeric" });
const fmtLong = new Intl.DateTimeFormat("de-CH", { timeZone: "UTC", weekday: "long", day: "numeric", month: "long" });
const keyDate = key => new Date(key + "T12:00:00Z");
function shiftMonth(month, by) {
  const d = new Date(month + "-15T12:00:00Z");
  d.setUTCMonth(d.getUTCMonth() + by);
  return d.toISOString().slice(0, 7);
}
function selectCal(day, month) {
  calDay = day;
  calMonth = month;
  renderSport();
}
function renderCalendar(sheet, upcoming, now) {
  const days = new Map();
  upcoming.forEach(e => {
    const key = fmtKey.format(e.start);
    if (!days.has(key)) days.set(key, []);
    days.get(key).push(e);
  });
  const keys = [...days.keys()].sort();
  if (!calDay || !days.has(calDay)) {
    const inMonth = calMonth && keys.find(k => k.startsWith(calMonth));
    calDay = inMonth || (calMonth && calMonth > keys[0].slice(0, 7) && calMonth <= keys[keys.length - 1].slice(0, 7) ? null : keys[0]);
    if (calDay) calMonth = calDay.slice(0, 7);
  }
  const first = keys[0].slice(0, 7), last = keys[keys.length - 1].slice(0, 7);

  const head = el("div", "cal-head");
  const nav = (text, label, by, off) => {
    const b = el("button", "cal-nav", text);
    b.type = "button";
    b.setAttribute("aria-label", label);
    b.disabled = off;
    b.addEventListener("click", () => {
      const month = shiftMonth(calMonth, by);
      selectCal(keys.find(k => k.startsWith(month)) || null, month);
    });
    return b;
  };
  head.append(
    nav("‹", "Vorheriger Monat", -1, calMonth <= first),
    el("div", "cal-month", fmtMonth.format(keyDate(calMonth + "-15"))),
    nav("›", "Nächster Monat", 1, calMonth >= last)
  );
  sheet.append(head);

  const grid = el("div", "cal-grid");
  ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].forEach(d => grid.append(el("div", "cal-dow", d)));
  const start = keyDate(calMonth + "-01");
  for (let i = 0; i < (start.getUTCDay() + 6) % 7; i++) grid.append(el("div", "cal-day outside"));
  const todayKey = fmtKey.format(now);
  for (const d = new Date(start); d.toISOString().slice(0, 7) === calMonth; d.setUTCDate(d.getUTCDate() + 1)) {
    const key = d.toISOString().slice(0, 10);
    const list = days.get(key);
    const cell = el(list ? "button" : "div", "cal-day" + (key === todayKey ? " today" : ""), String(d.getUTCDate()));
    if (list) {
      cell.type = "button";
      cell.dataset.day = key;
      cell.setAttribute("aria-pressed", String(key === calDay));
      cell.setAttribute("aria-label", fmtLong.format(keyDate(key)) + ", " + list.length + (list.length === 1 ? " Termin" : " Termine"));
      const dots = el("span", "cal-dots");
      if (list.some(e => !e.channel)) dots.append(el("span", "cal-dot"));
      if (list.some(e => e.channel)) dots.append(el("span", "cal-dot sport1"));
      cell.append(dots);
      cell.addEventListener("click", () => {
        selectCal(key, calMonth);
        const again = sheet.querySelector('[data-day="' + key + '"]');
        if (again) again.focus();
      });
    }
    grid.append(cell);
  }
  sheet.append(grid);

  const legend = el("div", "cal-legend");
  const mark = (cls, text) => {
    const s = el("span");
    s.append(el("span", cls), text);
    return s;
  };
  legend.append(mark("cal-dot", "SRF"), mark("cal-dot sport1", "Sport 1"));
  sheet.append(legend);

  if (!calDay) {
    sheet.append(el("p", "cal-title", "In diesem Monat ist nichts geplant."));
    return;
  }
  sheet.append(el("h2", "cal-title", fmtLong.format(keyDate(calDay))));
  const ul = el("ul");
  days.get(calDay).forEach(e => {
    const li = el("li", "event");
    const top = el("div", "event-top");
    top.append(el("span", "", fmtTime.format(e.start) + " Uhr"));
    top.append(el("span", "", e.sport));
    li.append(top);
    li.append(el("span", "event-name", e.name));
    if (e.note) li.append(el("span", "event-note", e.note));
    if (e.url) {
      const note = el("span", "event-note");
      const a = el("a", "", e.channel ? "Stream bei " + e.channel + " öffnen" : "Stream bei Play SRF öffnen");
      a.href = e.url; a.target = "_blank"; a.rel = "noopener";
      note.append(a);
      li.append(note);
    }
    ul.append(li);
  });
  sheet.append(ul);
}

  const rare = upcoming.some(e => /^(Rad|Radsport|Bahnrad|Strassenrad|Mountainbike|Bike|Radquer|Querfeldein|Cyclocross|Triathlon|OL|Orientierungslauf)/.test(e.sport));
  const league = upcoming.some(e => /National League/.test(e.note + e.name));
  const missing = (rare ? [] : ["Rad", "Triathlon", "OL"]).concat(league ? [] : ["National League"]);
  foot.append((missing.length ? missing.join(", ") + ": zurzeit keine Livestreams bei SRF geplant. " : "") + "Ohne Stream-Link ist die Übertragung noch nicht bei SRF aufgeführt. ");
  const all = el("a", "", "Alle Sport-Livestreams ansehen");
  all.href = SRF_LIST; all.target = "_blank"; all.rel = "noopener";
  foot.append(all);
  sheet.append(foot);
  sheet.scrollTop = keepScroll;
}

const bar = document.getElementById("bar");
const sheetEl = document.getElementById("sheet");
const chev = document.getElementById("chev");
function setOpen(open) {
  sheetEl.hidden = !open;
  bar.setAttribute("aria-expanded", String(open));
  chev.textContent = open ? "Schliessen" : "Kalender";
}
bar.addEventListener("click", () => setOpen(sheetEl.hidden));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !sheetEl.hidden) { setOpen(false); bar.focus(); }
});

/* Sportkalender am Desktop aus- und einblenden, die Wahl bleibt gespeichert. */
const sportToggle = document.getElementById("sportToggle");
function setSportHidden(hidden) {
  document.body.classList.toggle("sport-hidden", hidden);
  sportToggle.textContent = hidden ? "Sport einblenden" : "Sport ausblenden";
  try { localStorage.setItem("sportHidden", hidden ? "1" : "0"); } catch (e) {}
}
let sportHiddenSaved = false;
try { sportHiddenSaved = localStorage.getItem("sportHidden") === "1"; } catch (e) {}
setSportHidden(sportHiddenSaved);
sportToggle.addEventListener("click", () => setSportHidden(!document.body.classList.contains("sport-hidden")));

document.getElementById("today").textContent = fmtToday.format(new Date());
renderServices();
renderSport();
const DATA_DATE = new Date("2026-11-03T12:00:00+01:00");
function renderStand() {
  const age = dayNumber(new Date()) - dayNumber(DATA_DATE);
  const date = new Intl.DateTimeFormat("de-CH", { timeZone: TZ, day: "numeric", month: "long" }).format(DATA_DATE);
  const base = srfLive ? "Empfehlungen: Stand " + date + ". SRF-Termine: aktuell geladen." : "Empfehlungen und Termine: Stand " + date + ".";
  document.getElementById("stand").textContent = age > 14 ? base + " Lass sie im Chat mit Claude neu aktualisieren." : base;
}
renderStand();
/* Zeigt bei Twitch nur Kanäle, denen du folgst. Die Anmeldung stammt von SmartStream, das unter derselben Adresse läuft. */
const TWITCH = SERVICES.find(s => s.cls === "twitch");
const TWITCH_CACHE = "followedCards";
function readStore(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function followedCard(login, name, game, art) {
  const safe = String(login).toLowerCase();
  const card = { t: name || safe, g: game ? "Live: " + game : "Gerade offline", url: SMARTSTREAM + "?channel=" + encodeURIComponent(safe) };
  if (art) card.imgUrl = art.replace("{width}", "480").replace("{height}", "640");
  else { card.icon = "play"; card.a = "#2a1259"; card.b = "#7c3aed"; }
  return card;
}
async function loadFollowed() {
  const token = readStore("token"), clientId = readStore("clientId");
  if (!token || !clientId) return;
  try {
    const check = await fetch("https://id.twitch.tv/oauth2/validate", { headers: { Authorization: "OAuth " + token } });
    if (check.status === 401) {
      TWITCH.items = [];
      TWITCH.empty = "Deine Twitch-Anmeldung ist abgelaufen. Öffne SmartStream und melde dich neu an.";
      renderServices();
      return;
    }
    if (!check.ok) return;
    const userId = (await check.json()).user_id;
    const helix = async path => {
      const r = await fetch("https://api.twitch.tv/helix/" + path, { headers: { Authorization: "Bearer " + token, "Client-Id": clientId } });
      if (!r.ok) throw new Error("Twitch " + r.status);
      return (await r.json()).data || [];
    };
    const live = (await helix("streams/followed?first=100&user_id=" + userId))
      .sort((a, b) => b.viewer_count - a.viewer_count).slice(0, 3);
    const gameIds = [...new Set(live.map(s => s.game_id).filter(Boolean))];
    const games = gameIds.length ? await helix("games?" + gameIds.map(id => "id=" + encodeURIComponent(id)).join("&")) : [];
    const art = new Map(games.map(g => [g.id, g.box_art_url]));
    const cards = live.map(s => followedCard(s.user_login, s.user_name, s.game_name, art.get(s.game_id)));
    if (cards.length < 3) {
      const seen = new Set(live.map(s => s.user_login.toLowerCase()));
      const followed = await helix("channels/followed?first=100&user_id=" + userId);
      followed.filter(c => !seen.has(c.broadcaster_login.toLowerCase())).slice(0, 3 - cards.length)
        .forEach(c => cards.push(followedCard(c.broadcaster_login, c.broadcaster_name)));
    }
    TWITCH.items = cards;
    TWITCH.empty = "Du folgst auf Twitch noch keinem Kanal.";
    try { localStorage.setItem(TWITCH_CACHE, JSON.stringify(cards)); } catch (e) {}
    renderServices();
  } catch (e) {
    /* Ohne Verbindung bleibt die zuletzt geladene Liste stehen. */
  }
}
try {
  const saved = JSON.parse(readStore(TWITCH_CACHE) || "[]");
  if (saved.length) { TWITCH.items = saved; renderServices(); }
} catch (e) {}
loadFollowed();
setInterval(loadFollowed, 5 * 60000);
async function loadSrfLive() {
  try {
    let url = SRF_API, list = [], pages = 0;
    while (url && pages < 8) {
      const r = await fetch(url);
      if (!r.ok) return;
      const d = await r.json();
      list = list.concat(d.mediaList || []);
      url = d.next;
      pages++;
    }
    const events = srfEvents(list);
    if (!events.length) return;
    EVENTS = events;
    srfLive = true;
    renderSport();
    renderStand();
  } catch (e) {
    /* Ohne Verbindung bleiben die mitgelieferten Termine. */
  }
}
loadSrfLive();
setInterval(loadSrfLive, 6 * 3600000);
setInterval(() => {
  document.getElementById("today").textContent = fmtToday.format(new Date());
  renderServices();
  renderSport();
  renderStand();
}, 60000);
</script>
