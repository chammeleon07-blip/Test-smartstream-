<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Programm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #e8eef2;
  --surface: #f6f9fb;
  --ink: #13233a;
  --muted: #4e5f73;
  --line: #c6d1da;
  --red: #b3122a;
  --red-deep: #8c0c20;
  --focus: #0b63c5;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1a2a;
    --surface: #172437;
    --ink: #eaf0f5;
    --muted: #a3b2c2;
    --line: #2a3a4f;
    --focus: #7dbbff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1a2a;
  --surface: #172437;
  --ink: #eaf0f5;
  --muted: #a3b2c2;
  --line: #2a3a4f;
  --focus: #7dbbff;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
  max-width: 44rem;
  margin: 0 auto;
  padding: .9rem .8rem calc(5.5rem + env(safe-area-inset-bottom, 0px));
}
h1, .now-title {
  font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1 { margin: 0; font-size: 1.3rem; line-height: 1.1; font-weight: 800; letter-spacing: -.015em; }
.today { margin: .05rem 0 .7rem; font-size: .8rem; color: var(--muted); }
a, button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Dienste mit je drei Vorschlägen */
.service { padding: .7rem 0 .8rem; border-top: 1px solid var(--line); }
.service:first-of-type { border-top: 0; padding-top: 0; }
.service-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .45rem; }
.chip {
  display: inline-flex; align-items: center; min-height: 2.25rem; padding: .25rem .7rem;
  border-radius: .55rem; text-decoration: none;
  font: 800 .98rem/1.1 "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; letter-spacing: -.01em;
}
.browser { display: inline-flex; align-items: center; min-height: 2.25rem; font-size: .8rem; color: var(--muted); text-underline-offset: 2px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .45rem; }
.card { min-width: 0; color: inherit; text-decoration: none; display: block; }
.thumb {
  position: relative; aspect-ratio: 16 / 10; border-radius: .5rem; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--a), var(--b));
}
.thumb svg { width: 46%; height: 62%; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.badge {
  position: absolute; left: .22rem; bottom: .22rem; padding: .05rem .28rem; border-radius: .25rem;
  background: rgba(0, 0, 0, .72); color: #fff; font-size: .62rem; line-height: 1.3; font-weight: 600;
}
.card-title {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  margin-top: .25rem; font-size: .76rem; line-height: 1.2; font-weight: 600;
}
.card-sub { display: block; margin-top: .05rem; font-size: .68rem; line-height: 1.2; color: var(--muted); }
.notice { margin: .45rem 0 0; font-size: .8rem; color: var(--muted); }
.notice a { color: var(--ink); font-weight: 600; }
.netflix { background: #000; color: #ff2a33; }
.prime { background: #00a8e1; color: #03212e; }
.nebula { background: #16245c; color: #8fd2ff; }
.youtube { background: #e00000; color: #fff; }
.twitch { background: #7c3aed; color: #fff; }

/* SRF-Sport-Einblendung */
.lower {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 10;
  background: var(--red);
  color: #fff;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -10px 30px rgba(10, 20, 35, .28);
}
.lower-inner { max-width: 44rem; margin: 0 auto; }
.bar {
  appearance: none;
  width: 100%;
  min-height: 3.5rem;
  padding: .4rem .8rem;
  display: grid;
  grid-template-columns: 1fr auto;
  column-gap: .75rem;
  align-items: center;
  background: transparent;
  border: 0;
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.bar:focus-visible { outline-color: #fff; outline-offset: -5px; }
.now-label { display: block; font-size: .7rem; font-weight: 600; opacity: .92; }
.now-title { display: block; font-size: .95rem; line-height: 1.15; font-weight: 800; letter-spacing: -.012em; }
.now-when { display: block; font-size: .76rem; }
.chev { font-size: .76rem; font-weight: 600; white-space: nowrap; }
.sheet {
  max-height: min(66vh, 34rem);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--red-deep);
  padding: .25rem 1rem .75rem;
}
.sheet[hidden] { display: none; }
.sheet ul { list-style: none; margin: 0; padding: 0; }
.event { padding: .7rem 0; border-bottom: 1px solid rgba(255, 255, 255, .22); }
.event:last-child { border-bottom: 0; }
.event-top { display: flex; justify-content: space-between; gap: .75rem; font-size: .84rem; }
.event-name { display: block; margin-top: .1rem; font-weight: 600; line-height: 1.25; }
.event-note { display: block; margin-top: .1rem; font-size: .82rem; }
.event a { color: #fff; font-weight: 600; text-underline-offset: 2px; }
.event a:focus-visible, .sheet a:focus-visible { outline-color: #fff; }
.sheet-foot { margin: .6rem 0 .25rem; font-size: .84rem; }
.sheet-foot a { color: #fff; font-weight: 600; }

@media (min-width: 40rem) {
  .card-title { font-size: .86rem; }
}
</style>
</head>
<body>
<main>
  <h1>Mein Programm</h1>
  <p class="today" id="today"></p>
  <div id="services"></div>
  <p class="notice" id="stand"></p>
</main>

<aside class="lower" aria-label="SRF Sport">
  <div class="lower-inner">
    <div class="sheet" id="sheet" hidden></div>
    <button class="bar" id="bar" type="button" aria-expanded="false" aria-controls="sheet">
      <span>
        <span class="now-label" id="nowLabel">SRF Sport, nächster Livestream</span>
        <span class="now-title" id="nowTitle"></span>
        <span class="now-when" id="nowWhen"></span>
      </span>
      <span class="chev" id="chev">Alle Termine</span>
    </button>
  </div>
</aside>

let srfLive = false;

/* Filtert das SRF-Programm nach deinen Sportarten. */
const SRF_API = "https://il.srgssr.ch/integrationlayer/2.0/srf/mediaList/video/scheduledLivestreams?vector=portalplay&pageSize=100";
function srfInteresting(title) {
  const t = title.trim();
  if (/Gebärdensprache|Medienkonferenz/.test(t)) return false;
  if (/^Ski Alpin\s*:/.test(t)) return !/Siegerehrung|Star Challenge/.test(t);
  if (/^(Rad|Radsport|Bahnrad|Strassenrad|Mountainbike|Bike|Radquer|Querfeldein|Cyclocross|Triathlon|OL|Orientierungslauf)\b/.test(t)) return true;
  const swiss = /\bSchweiz\b/.test(t);
  if (/^Eishockey\s*:/.test(t) && (swiss || /National League/.test(t))) return true;
  const champs = /(^|[\s:,-])(EM|WM)([\s,:]|$)/.test(t) && !/Qualifikation/.test(t);
  return champs && (swiss || !/\S - \S/.test(t));
}
function srfSlug(t) {
  return t.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function srfEvents(list) {
  const items = list.filter(x => x.title && x.validFrom && srfInteresting(x.title));
  const key = t => t.trim().replace(/,\s*[12]\. Lauf$/, "");
  const second = new Map(items.filter(x => /2\. Lauf$/.test(x.title.trim())).map(x => [key(x.title), x]));
  const firsts = new Set(items.filter(x => /1\. Lauf$/.test(x.title.trim())).map(x => key(x.title)));
  const events = [];
  items.forEach(x => {
    const raw = x.title.trim();
    if (/2\. Lauf$/.test(raw) && firsts.has(key(raw))) return;
    const colon = raw.indexOf(":");
    const sport = raw.slice(0, colon).trim();
    const parts = key(raw).slice(colon + 1).split(",").map(s => s.trim()).filter(Boolean);
    const e = { t: x.validFrom, h: 3, sport: sport === "Ski Alpin" ? "Ski alpin" : sport };
    const place = parts[0] && parts[0].match(/^Weltcup (?:in|im) (.+)$/);
    const run2 = second.get(key(raw));
    if (place) {
      e.name = parts.slice(1).join(", ");
      e.note = place[1];
      if (run2) {
        e.note += ", 2. Lauf " + new Date(run2.validFrom).toLocaleTimeString("de-CH", { timeZone: "Europe/Zurich", hour: "2-digit", minute: "2-digit" });
        e.h = (new Date(run2.validFrom) - new Date(x.validFrom)) / 3600000 + 2;
      }
    } else if (/\S - \S/.test(parts[parts.length - 1] || "")) {
      e.name = parts[parts.length - 1].replace(" - ", " – ");
      e.note = parts.slice(0, -1).join(", ");
    } else {
      e.name = parts.join(", ");
      e.note = /final|bronze/i.test(e.name) ? "Schweizer Beteiligung noch offen" : "";
    }
    if (x.cesimId) e.url = play(srfSlug(raw), x.cesimId);
    events.push(e);
  });
  return events;
}

const TZ = "Europe/Zurich";
const fmtDay = new Intl.DateTimeFormat("de-CH", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
const fmtShort = new Intl.DateTimeFormat("de-CH", { timeZone: TZ, day: "numeric", month: "numeric" });
const fmtTime = new Intl.DateTimeFormat("de-CH", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
const fmtToday = new Intl.DateTimeFormat("de-CH", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
const fmtKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });

function dayNumber(date) {
  const [y, m, d] = fmtKey.format(date).split("-").map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}
function relative(date, now) {
  const days = dayNumber(date) - dayNumber(now);
  if (days === 0) return "heute";
  if (days === 1) return "morgen";
  return "in " + days + " Tagen";
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderServices() {
  const now = new Date();
  const root = document.getElementById("services");
  root.textContent = "";
  SERVICES.forEach(svc => {
    const section = el("section", "service");
    section.setAttribute("aria-label", svc.name);
    const head = el("div", "service-head");
    const chip = el("a", "chip " + svc.cls, svc.name);
    chip.href = svc.url;
    chip.target = "_blank"; chip.rel = "noopener";
    head.append(chip);
    section.append(head);

    const cards = el("div", "cards");
    svc.items.forEach(item => {
      const card = el("a", "card");
      card.href = item.url; card.target = "_blank"; card.rel = "noopener";
      const thumb = el("span", "thumb");
      if (item.img) {
        const pic = el("img");
        pic.src = THUMBS[item.img];
        pic.alt = "";
        pic.width = 480;
        pic.height = 300;
        thumb.append(pic);
      } else {
        thumb.style.setProperty("--a", item.a);
        thumb.style.setProperty("--b", item.b);
        thumb.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[item.icon] + "</svg>");
      }
      if (item.from) {
        const start = new Date(item.from + "T00:00:00+01:00");
        if (start > now) thumb.append(el("span", "badge", "ab " + fmtShort.format(start)));
      }
      card.append(thumb, el("span", "card-title", item.t), el("span", "card-sub", item.g));
      cards.append(card);
    });
    section.append(cards);
    root.append(section);
  });
}

function renderSport() {
  const now = new Date();
  const upcoming = EVENTS
    .map(e => ({ ...e, start: new Date(e.t) }))
    .filter(e => e.start.getTime() + e.h * 3600000 > now.getTime())
    .sort((a, b) => a.start - b.start);

  const title = document.getElementById("nowTitle");
  const when = document.getElementById("nowWhen");
  const label = document.getElementById("nowLabel");
  const sheet = document.getElementById("sheet");
  sheet.textContent = "";

  if (!upcoming.length) {
    label.textContent = "SRF Sport";
    title.textContent = "Keine gespeicherten Termine mehr";
    when.textContent = "Tippen für das aktuelle SRF-Angebot";
  } else {
    const next = upcoming[0];
    const live = next.start <= now;
    label.textContent = live ? "SRF Sport, läuft laut Plan gerade" : "SRF Sport, nächster Livestream";
    title.textContent = next.sport + ": " + next.name;
    when.textContent = live
      ? next.note
      : fmtDay.format(next.start) + ", " + fmtTime.format(next.start) + " Uhr, " + relative(next.start, now);
  }

  const ul = el("ul");
  upcoming.forEach(e => {
    const li = el("li", "event");
    const top = el("div", "event-top");
    top.append(el("span", "", fmtDay.format(e.start) + ", " + fmtTime.format(e.start) + " Uhr"));
    top.append(el("span", "", e.sport));
    li.append(top);
    li.append(el("span", "event-name", e.name));
    li.append(el("span", "event-note", e.note));
    if (e.url) {
      const note = el("span", "event-note");
      const a = el("a", "", "Stream bei Play SRF öffnen");
      a.href = e.url; a.target = "_blank"; a.rel = "noopener";
      note.append(a);
      li.append(note);
    }
    ul.append(li);
  });
  sheet.append(ul);
  const foot = el("p", "sheet-foot");
  const rare = upcoming.some(e => /^(Rad|Radsport|Bahnrad|Strassenrad|Mountainbike|Bike|Radquer|Querfeldein|Cyclocross|Triathlon|OL|Orientierungslauf)/.test(e.sport));
  const league = upcoming.some(e => /National League/.test(e.note + e.name));
  const missing = (rare ? [] : ["Rad", "Triathlon", "OL"]).concat(league ? [] : ["National League"]);
  foot.append((missing.length ? missing.join(", ") + ": zurzeit keine Livestreams bei SRF geplant. " : "") + "Ohne Stream-Link ist die Übertragung noch nicht bei SRF aufgeführt. ");
  const all = el("a", "", "Alle Sport-Livestreams ansehen");
  all.href = SRF_LIST; all.target = "_blank"; all.rel = "noopener";
  foot.append(all);
  sheet.append(foot);
}

const bar = document.getElementById("bar");
const sheetEl = document.getElementById("sheet");
const chev = document.getElementById("chev");
function setOpen(open) {
  sheetEl.hidden = !open;
  bar.setAttribute("aria-expanded", String(open));
  chev.textContent = open ? "Schliessen" : "Alle Termine";
}
bar.addEventListener("click", () => setOpen(sheetEl.hidden));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !sheetEl.hidden) { setOpen(false); bar.focus(); }
});

document.getElementById("today").textContent = fmtToday.format(new Date());
renderServices();
renderSport();
const DATA_DATE = new Date("2026-11-03T12:00:00+01:00");
function renderStand() {
  const age = dayNumber(new Date()) - dayNumber(DATA_DATE);
  const date = new Intl.DateTimeFormat("de-CH", { timeZone: TZ, day: "numeric", month: "long" }).format(DATA_DATE);
  const base = srfLive ? "Empfehlungen: Stand " + date + ". SRF-Termine: aktuell geladen." : "Empfehlungen und Termine: Stand " + date + ".";
  document.getElementById("stand").textContent = age > 14 ? base + " Lass sie im Chat mit Claude neu aktualisieren." : base;
}
renderStand();
async function loadSrfLive() {
  try {
    let url = SRF_API, list = [], pages = 0;
    while (url && pages < 8) {
      const r = await fetch(url);
      if (!r.ok) return;
      const d = await r.json();
      list = list.concat(d.mediaList || []);
      url = d.next;
      pages++;
    }
    const events = srfEvents(list);
    if (!events.length) return;
    EVENTS = events;
    srfLive = true;
    renderSport();
    renderStand();
  } catch (e) {
    /* Ohne Verbindung bleiben die mitgelieferten Termine. */
  }
}
loadSrfLive();
setInterval(loadSrfLive, 6 * 3600000);
setInterval(() => {
  document.getElementById("today").textContent = fmtToday.format(new Date());
  renderServices();
  renderSport();
  renderStand();
}, 60000);
</script>
